server:
  port: 8080

spring:
  application:
    name: apix-english-center-api

  datasource:
    url: jdbc:postgresql://localhost:5432/${DB_NAME:apix_english_center}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:apix_local_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
