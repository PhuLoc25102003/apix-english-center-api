server:
  port: 8080

spring:
  application:
    name: apix-english-center-api

  datasource:
    url: jdbc:postgresql://localhost:5432/${DB_NAME:apix_english_center}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:Loc0918119316@}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: "0"

security:
  jwt:
    secret: ${JWT_SECRET:8db1fa122241cf0ea8b4e723528b9ecf8e06385a4f78326a0b9a9d701cd4df9f}
    access-token-expiration-minutes: 60
    refresh-token-expiration-days: 30
    cookie-secure: ${COOKIE_SECURE:false}
